# ============================================================================
# 파일 위치 : 프로젝트루트/.github/workflows/cicd.yml
# 역할      : main 등 어떤 브랜치든 git push 가 일어나면
#             (1) GitHub 서버의 리눅스 가상머신에서 프로젝트를 빌드·테스트하고  ← CI
#             (2) 만들어진 jar 파일을 AWS 일래스틱 빈스톡 환경에 자동 배포한다 ← CD
#
# 이 파일을 읽고 실행하는 주체
#   - GitHub 저장소의 Actions 기능이 .github/workflows 폴더 안의 *.yml 파일을
#     전부 읽어 "워크플로(workflow)"로 등록한다.
#   - push 이벤트가 생기면 GitHub 가 "러너(runner)"라고 부르는 가상머신을 1대 빌려주고,
#     그 가상머신 안에서 아래 steps 를 위에서부터 한 줄씩 차례대로 실행한다.
#   - 실행 결과는 GitHub 저장소 화면 → [Actions] 탭에서 단계별 로그로 확인한다.
# ============================================================================

# name : [Actions] 탭 왼쪽 목록에 표시되는 워크플로 이름
name: CI/CD

# on : 이 워크플로를 "언제" 실행할지 지정하는 이벤트(트리거)
#   push 만 적고 브랜치를 지정하지 않았으므로
#   → 모든 브랜치에 push 할 때마다 실행된다.
#   main 브랜치에서만 배포하고 싶으면 아래처럼 바꾼다.
#     on:
#       push:
#         branches: [ main ]
on:
  push

# jobs : 실제로 할 작업 묶음. 여러 job 을 적으면 기본적으로 동시에(병렬) 실행된다.
jobs:
  # build : job 의 ID(이름). [Actions] 탭 실행 화면에 "build" 로 표시된다.
  build:
    # runs-on : 이 job 을 실행할 가상머신의 운영체제
    #   ubuntu-latest → GitHub 가 제공하는 최신 Ubuntu 리눅스 가상머신.
    #   job 이 끝나면 이 가상머신은 삭제되므로 매번 깨끗한 상태에서 시작한다.
    runs-on: ubuntu-latest

    # steps : 가상머신 안에서 위에서 아래로 순서대로 실행할 단계 목록
    #   - uses: 남이 만들어 GitHub 에 공개해 둔 "액션(action)"을 가져다 실행
    #   - run : 리눅스 셸(bash) 명령어를 직접 실행
    steps:
      # [1단계] 저장소 코드 내려받기
      #   actions/checkout 액션(v6 버전)이 지금 push 된 커밋의 소스 코드를
      #   가상머신의 작업 폴더($GITHUB_WORKSPACE, 보통 /home/runner/work/저장소명/저장소명)로
      #   git clone 한다. 이 단계가 없으면 가상머신 안에 build.gradle, src 폴더가 없다.
      - uses: actions/checkout@v6

      # [2단계] JDK 설치
      #   actions/setup-java 액션(v5 버전)이 JDK 를 내려받아 설치하고
      #   JAVA_HOME 환경 변수와 PATH 에 java 명령 경로를 등록한다.
      - uses: actions/setup-java@v5
        # with : 액션에 넘겨주는 입력값(파라미터)
        with:
          # distribution : 어느 회사가 배포한 JDK 를 쓸지
          #   'corretto' → 아마존이 배포하는 Amazon Corretto JDK.
          #   일래스틱 빈스톡 플랫폼 브랜치를 "Corretto 25 running on 64bit Amazon Linux 2023"
          #   으로 골랐으므로, 빌드하는 JDK 도 같은 Corretto 로 맞춘다.
          distribution: 'corretto'
          # java-version : JDK 버전. build.gradle 의
          #   java { toolchain { languageVersion = JavaLanguageVersion.of(25) } } 와 같아야 한다.
          #   다르면 Gradle 이 25 버전 JDK 를 찾지 못해 빌드가 실패한다.
          java-version: '25'

      # [3단계] gradlew 실행 권한 부여
      #   name : [Actions] 로그 화면에 표시될 단계 이름
      - name: Grant execute permission for gradlew
        #   윈도우에서 커밋한 gradlew 파일에는 리눅스 "실행 권한(x)" 정보가 없는 경우가 많다.
        #   chmod +x 로 실행 권한을 주지 않으면 다음 단계의 ./gradlew 가
        #   "Permission denied" 오류로 실패한다.
        run: chmod +x gradlew

      # [4단계] Gradle 빌드
      - name: Build with Gradle
        #   ./gradlew : 프로젝트에 포함된 Gradle Wrapper 스크립트.
        #               gradle/wrapper/gradle-wrapper.properties 에 적힌 버전의 Gradle 을
        #               내려받아 실행하므로 가상머신에 Gradle 을 따로 설치할 필요가 없다.
        #   clean     : build 폴더를 통째로 지운다(이전 결과물 .jar 제거).
        #   build     : compileJava → test(src/test 의 JUnit 테스트 전부 실행) → jar, bootJar 를 차례로 실행.
        #               테스트가 하나라도 실패하면 여기서 워크플로가 멈추고 배포 단계로 넘어가지 않는다.
        #               → 이것이 "테스트를 통과한 코드만 배포된다"는 CI 의 핵심이다.
        #   결과물    : build/libs 폴더에 jar 파일 2개가 생긴다.
        #               springboot-developer-0.0.1-SNAPSHOT.jar       ← bootJar 결과. 톰캣 내장, java -jar 로 실행 가능
        #               springboot-developer-0.0.1-SNAPSHOT-plain.jar ← jar 결과. 의존 라이브러리 없음, 단독 실행 불가
        run: ./gradlew clean build

      # [5단계] 현재 시각 구하기 (배포 버전 이름에 붙이기 위해 springboot-developer-0.0.1-SNAPSHOT_2026-11-30.jar)
      - name: Get current time
        #   josStorer/get-current-time 액션(v2.0.2)이 현재 시각을 지정한 형식의 문자열로 만들어
        #   이 단계의 출력값(outputs)으로 내보낸다.
        uses: josStorer/get-current-time@v2.0.2
        # id : 이 단계의 ID. 뒤 단계에서 ${{ steps.current-time.outputs.formattedTime }} 처럼
        #      "steps.<id>.outputs.<출력이름>" 형식으로 이 단계의 출력값을 꺼내 쓸 때 사용한다.
        id: current-time
        with:
          # format : 출력 형식. 예) 2026-11-03T16-00-00
          #   일래스틱 빈스톡 버전 레이블에는 콜론(:)을 쓰지 않는 편이 안전하므로 시:분:초를 하이픈(-)으로 구분했다.
          format: YYYY-MM-DDTHH-mm-ss
          # utcOffset : GitHub 가상머신 리눅스 가 깔린 서버는 UTC(영국 시간) 기준이므로 +09:00 을 주어 한국 시간으로 바꾼다.
          utcOffset: "+09:00"

      # [6단계] 배포할 jar 파일 이름을 환경 변수에 저장
      - name: Set artifact
        #   ls ./build/libs   : build/libs 폴더의 파일 이름 목록을 출력
        #   | grep -v plain   : 그중 "plain" 이 들어간 줄(…-plain.jar)을 제외한다.
        #                       (4단계 설명처럼 jar 가 2개 생기므로, 제외하지 않으면 두 줄이 함께 들어가
        #                        $GITHUB_ENV 형식 오류가 나거나 실행 불가능한 plain.jar 가 배포된다.)
        #   echo "artifact=…" >> $GITHUB_ENV
        #       : $GITHUB_ENV 는 GitHub 가 job 마다 만들어 주는 파일 경로가 담긴 변수이다.
        #         이 파일에 "이름=값" 한 줄을 추가하면, 다음 단계부터 ${{ env.이름 }} 으로 값을 꺼내 쓸 수 있다.
        #   결과 : env.artifact = springboot-developer-0.0.1-SNAPSHOT.jar
        run: echo "artifact=$(ls ./build/libs | grep -v plain)" >> $GITHUB_ENV

      # [7단계] 일래스틱 빈스톡에 배포
      - name: Beanstalk Deploy
        #   einaregilsson/beanstalk-deploy 액션(v20)이 AWS API 를 호출하여 다음을 순서대로 수행한다.
        #     ① deployment_package(jar)를 S3 버킷 elasticbeanstalk-ap-northeast-2-<AWS계정번호> 에 업로드
        #        (책 431쪽 S3 화면에 보이던 elasticbeanstalk-ap-northeast-2-… 버킷이 이 버킷이다)
        #     ② 그 파일로 "애플리케이션 버전"을 생성 (CreateApplicationVersion API)
        #     ③ 지정한 환경을 그 버전으로 교체 (UpdateEnvironment API)
        #     ④ 환경 상태가 Ok(초록색)가 될 때까지 기다린 뒤 성공/실패를 로그에 출력
        #   → 책 12.4절에서 손으로 하던 [업로드 및 배포] → [파일 선택] → [배포] 를 대신 해 주는 단계이다.
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          # aws_access_key / aws_secret_key : AWS API 를 호출할 IAM 사용자의 액세스 키
          #   ${{ secrets.이름 }} : GitHub 저장소 [Settings] → [Secrets and variables] → [Actions] 에
          #                         등록해 둔 비밀 값을 읽는다. 로그에는 *** 로 가려져 출력된다.
          #   키 값을 이 파일에 직접 적으면 GitHub 에 공개되어 계정이 도용되므로 반드시 secrets 를 사용한다.
          #   이 키의 IAM 사용자에게는 일래스틱 빈스톡 배포 권한
          #   (예: AdministratorAccess-AWSElasticBeanstalk 정책)이 연결되어 있어야 한다.
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # application_name : 일래스틱 빈스톡 콘솔의 "애플리케이션 이름"과 대소문자까지 똑같아야 한다.
          #   (책 413쪽 10단계에서 입력한 Blog)
          application_name: Blog
          # environment_name : 일래스틱 빈스톡 콘솔 [환경] 목록에 보이는 "환경 이름"과 똑같아야 한다.
          #   콘솔에 Blog-env-1  처럼 숫자가 붙어 있다면 그 이름 그대로 적어야
          #   "Environment not found" 오류가 나지 않는다.
          environment_name: Blog-env
          # version_label : 이번에 올리는 애플리케이션 버전의 이름.
          #   빈스톡은 같은 버전 레이블을 두 번 만들 수 없으므로 5단계에서 구한 시각을 붙여
          #   github-action-2026-11-03T16-00-00 처럼 매번 다른 이름이 되게 한다.
          version_label: github-action-${{steps.current-time.outputs.formattedTime}}
          # region : 빈스톡 환경을 만든 리전. ap-northeast-2 = 아시아 태평양(서울)
          region: ap-northeast-2
          # deployment_package : 업로드할 파일 경로. 6단계에서 저장한 env.artifact 를 사용한다.
          #   → ./build/libs/springboot-developer-0.0.1-SNAPSHOT.jar
          deployment_package: ./build/libs/${{env.artifact}}