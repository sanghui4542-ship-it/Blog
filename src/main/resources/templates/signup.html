<!DOCTYPE html>

<!--
  ======================================================================
  [1. 타임리프 네임스페이스(xmlns:th) 선언]
  ======================================================================
  - xmlns:th="http://www.thymeleaf.org"
  - 의미: "이 HTML 문서 안에서 'th:'로 시작하는 모든 속성은 서버 측 타임리프 엔진이 해석해라!"라는 선언입니다.
  - 동작: 사용자가 페이지를 요청하면, 스프링 서버가 이 태그들을 먼저 다 계산하여 순수 HTML로 완성한 뒤 브라우저로 보냅니다.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <!-- 부트스트랩 CSS 라이브러리 (화면 디자인 스타일) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

    <style>
        /* 배경 그라데이션 스타일 설정 */
        .gradient-custom {
            background: linear-gradient(to right, rgba(254, 238, 229, 1), rgba(229, 193, 197, 1))
        }
    </style>
</head>
<body class="gradient-custom">
<section class="d-flex vh-100">
    <div class="container-fluid row justify-content-center align-content-center">
        <div class="card bg-dark" style="border-radius: 1rem;">
            <div class="card-body p-5 text-center">
                <h2 class="text-white">SIGN UP</h2>
                <p class="text-white-50 mt-2 mb-5">서비스 사용을 위한 회원 가입</p>

                <div class="mb-2">
                    <!--
                      ======================================================================
                      [2. ★ 타임리프 URL 링크 표현식: th:action="@{/user}"]
                      ======================================================================
                      - th:action="@{/user}"
                        • '@{...}'는 타임리프의 'URL 링크 표현식' 문법입니다.
                        • 애플리케이션의 컨텍스트 경로(Context Path)를 자동으로 계산하여 안전하게 '/user' 주소로 Form을 전송합니다.
                        • HTML로 최종 변환될 때는 'action="/user"' 형태가 됩니다.

                      - method="POST"
                        • 회원가입 정보(이메일, 비밀번호)를 HTTP 본문(Body)에 담아 전달하는 POST 요청 방식입니다.

                      - CSRF 토큰 자동 생성 유의사항:
                        로그인 화면과 달리 여기서는 'th:action'을 사용했습니다.
                        스프링 시큐리티와 타임리프가 연동된 상태에서 'th:action'을 쓰면,
                        CSRF 보호가 활성화되어 있을 때 hidden 타입의 CSRF 토큰 input 태그가 자동으로 내부에 삽입됩니다!
                    -->
                    <form th:action="@{/user}" method="POST">

                        <!--
                          ======================================================================
                          [3. 이메일 입력 필드]
                          ======================================================================
                          - name="email"
                            • 사용자가 입력한 이메일 값이 백엔드의 DTO 객체(AddUserRequest)의 'email' 필드와 1:1로 자동으로 매핑(연결)됩니다.
                            • UserApiController의 signup(AddUserRequest request) 메서드로 넘어갑니다.
                        -->
                        <div class="mb-3">
                            <label class="form-label text-white">Email address</label>
                            <input type="email" class="form-control" name="email">
                        </div>

                        <!--
                          ======================================================================
                          [4. 비밀번호 입력 필드]
                          ======================================================================
                          - name="password"
                            • 사용자가 입력한 비밀번호 평문 문자열이 DTO 객체(AddUserRequest)의 'password' 필드와 매핑됩니다.
                            • 이후 UserService에서 BCryptPasswordEncoder를 통해 암호문으로 변환되어 DB에 저장됩니다.
                        -->
                        <div class="mb-3">
                            <label class="form-label text-white">Password</label>
                            <input type="password" class="form-control" name="password">
                        </div>

                        <!-- 폼 제출(Submit) 버튼: 클릭 시 /user POST 요청이 실행됩니다. -->
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
