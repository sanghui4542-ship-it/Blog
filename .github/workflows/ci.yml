# ============================================================================
# 파일 위치 : 프로젝트루트/.github/workflows/ci.yml
# 역할      : main 브랜치에 push 될 때 GitHub 가상머신에서 코드를 받아 JDK 를 설치하는
#             CI(지속적 통합) 워크플로의 시작 부분.
#
# 현재 상태
#   - 아래에는 "코드 내려받기 + JDK 설치" 두 단계만 있고 빌드·테스트 단계가 없다.
#     그래서 실행되면 JDK 설치까지만 하고 성공(초록색)으로 끝난다.
#   - 빌드·테스트·배포 전체는 같은 폴더의 cicd.yml 이 수행한다.
#   - 두 파일 모두 main 브랜치 push 에 반응하므로 main 에 push 하면 두 워크플로가 동시에 실행된다.
#     cicd.yml 만 쓰려면 이 파일을 삭제하거나, 빌드만 확인하고 싶다면 맨 아래 주석의 단계를 추가한다.
# ============================================================================

# name : [Actions] 탭에 표시되는 워크플로 이름
name: CI

# on.push.branches : main 브랜치에 push 될 때만 실행한다.
#   다른 브랜치(예: feature/login)에 push 하면 이 워크플로는 실행되지 않는다.
on:
  push:
    branches: [ main ]

jobs:
  # build : job ID
  build:
    # ubuntu-latest : GitHub 가 빌려주는 최신 Ubuntu 리눅스 가상머신에서 실행
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6 : push 된 커밋의 소스 코드를 가상머신 작업 폴더로 git clone
      - uses: actions/checkout@v6

      # actions/setup-java@v5 : Amazon Corretto JDK 25 를 설치하고 JAVA_HOME, PATH 를 설정
      #   build.gradle 의 toolchain 버전(25)과 일래스틱 빈스톡 플랫폼(Corretto 25)에 맞춘 값
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'

      # ── 빌드·테스트까지 확인하려면 아래 두 단계를 추가한다 ──
      # - name: Grant execute permission for gradlew
      #   run: chmod +x gradlew          # 윈도우에서 커밋한 gradlew 에 리눅스 실행 권한 부여
      # - name: Build with Gradle
      #   run: ./gradlew clean build     # 컴파일 + JUnit 테스트 + jar 생성. 테스트 실패 시 빨간색으로 실패
