<!DOCTYPE html>

<!--
  ======================================================================
  [1. 타임리프 네임스페이스(xmlns:th) 선언]
  ======================================================================
  - xmlns:th="http://www.thymeleaf.org"
  - 의미: "이 HTML 파일 안에서 'th:'로 시작하는 문법을 만나면 타임리프 엔진이 해석해라!"라는 선언입니다.
  - 동작 원리: 웹 브라우저에 화면이 그려지기 전, 백엔드 서버(스프링)가 이 문서를 먼저 읽어서
    'th:'로 붙은 태그들을 실제 HTML 값으로 변환(렌더링)한 뒤 완성된 결과물만 브라우저로 전송합니다.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <!-- 부트스트랩 CSS 라이브러리 (화면 디자인용) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

    <style>
        /* 배경 그라데이션 스타일 설정 */
        .gradient-custom {
            background: linear-gradient(to right, rgba(106, 17, 203, 1), rgba(37, 117, 252, 1))
        }
    </style>
</head>
<body class="gradient-custom">
<section class="d-flex vh-100">
    <div class="container-fluid row justify-content-center align-content-center">
        <div class="card bg-dark" style="border-radius: 1rem;">
            <div class="card-body p-5 text-center">
                <h2 class="text-white">LOGIN</h2>
                <p class="text-white-50 mt-2 mb-5">서비스를 사용하려면 로그인을 해주세요!</p>

                <div class="mb-2">
                    <!--
                      ======================================================================
                      [2. 로그인 폼 전송 설정]
                      ======================================================================
                      - action="/login": Submit 버튼 클릭 시 이 Form 데이터를 POST 방식으로 '/login' 주소로 전송합니다.
                      - method="POST": 비밀번호 등 민감 데이터를 요청 본문(Body)에 숨겨서 보냅니다.
                      - 스프링 시큐리티의 formLogin() 기능이 이 '/login' POST 요청을 받아 자동으로 로그인 검증을 수행합니다.
                    -->
                    <form action="/login" method="POST">

                        <!--
                          ======================================================================
                          [3. ★ 핵심 타임리프 문법: CSRF 보안 토큰 숨김 전송]
                          ======================================================================
                          - type="hidden": 화면에는 보이지 않는 숨김 입력창입니다.

                          - th:name="${_csrf?.parameterName}"
                            • 타임리프 변수 표현식 '${...}'을 사용해 서버가 보낸 CSRF 파라미터 이름(기본값: "_csrf")을 동적으로 가져옵니다.
                            • HTML로 변환되면 -> name="_csrf" 가 됩니다.
                            • '?.': null 안전 탐색 연산자입니다. 만약 _csrf 객체가 없더라도 에러를 내지 않고 안전하게 넘어가게 해줍니다.

                          - th:value="${_csrf?.token}"
                            • 서버(스프링 시큐리티)가 이번 요청에 대해 난수로 생성해 둔 암호화된 토큰 값(예: "4a8e-9c1b...")을 동적으로 삽입합니다.
                            • HTML로 변환되면 -> value="4a8e-9c1b..." 가 됩니다.

                          - 왜 필요한가요?
                            스프링 시큐리티는 "악의적인 다른 사이트가 사용자 몰래 제출하는 폼 공격(CSRF)"을 막기 위해,
                            서버가 발급한 진짜 토큰(열쇠) 값이 폼 데이터와 함께 넘어왔는지 검사합니다.
                        -->
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

                        <!--
                          ======================================================================
                          [4. 아이디(이메일) 입력창]
                          ======================================================================
                          - name="username": ★ 중요!
                            스프링 시큐리티 폼 로그인 처리기는 기본적으로 아이디 입력 필드의 name 속성을 "username"으로 찾습니다.
                            (Email 주소를 받더라도 name="username"으로 지정해야 시큐리티가 자동으로 받아 처리합니다.)
                        -->
                        <div class="mb-3">
                            <label class="form-label text-white">Email address</label>
                            <input type="email" class="form-control" name="username">
                        </div>

                        <!--
                          ======================================================================
                          [5. 비밀번호 입력창]
                          ======================================================================
                          - name="password": ★ 중요!
                            스프링 시큐리티가 비밀번호 필드로 인식하는 기본 name 값입니다.
                        -->
                        <div class="mb-3">
                            <label class="form-label text-white">Password</label>
                            <input type="password" class="form-control" name="password">
                        </div>

                        <!-- 폼 제출(Submit) 버튼 -->
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>

                    <!-- 회원가입 페이지 이동 버튼 -->
                    <button type="button" class="btn btn-secondary mt-3" onclick="location.href='/signup'">회원가입</button>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
